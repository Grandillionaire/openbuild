version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      vue-ecosystem:
        patterns:
          - 'vue'
          - 'vue-*'
          - '@vue/*'
          - 'pinia'
          - '@vueuse/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
          - '@testing-library/*'
          - 'happy-dom'
      types:
        patterns:
          - '@types/*'
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'
